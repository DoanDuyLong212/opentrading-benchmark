# Registry thực thể — bộ CHÍNH 200 + holdout 50 (thi công 02/11/2026)
# Nguồn: tools/build_plan.py (pools) + tools/manifest.json (phân bổ). Thay bản pilot trước.
#
# LUẬT ĐẾM (đã nới có ghi chú so với bản gốc ≤2/thực thể):
#  - VN/crypto/gf: ≤2 task cá thể / thực thể / split (assert tự động khi build_plan chạy).
#  - Task theo RỔ (agg/screen/tech-multi/compare): đếm theo rổ, KHÔNG tính vào ≤2 cá thể.
#  - Crypto: nguồn khả dụng hạn chế (binance 429 thường trực) → dùng yf (BTC/ETH/SOL/BNB) +
#    vn_crypto_ohlcv (BTC/ETH); mỗi ticker ≤4 lần với điều kiện khác family+kinds và có biến thể đề.
#  - Macro: đếm theo (series@kỳ) ≤2; CPI khai thác dưới dạng sub-series + GDP TỔNG SỐ.
#  - Vàng/FX: holdout dùng chung pool với main (nguồn msn+yf chỉ ~15 chuỗi).
#
# NGOẠI LỆ THỰC TẾ DỮ LIỆU (đã xử lý trong thiết kế task):
#  - LTG, VIS: BCTC stale (2023–2024) → loại khỏi mọi họ tài chính/kỳ.
#  - SBT: BCTC stale (hết 2025) → chỉ dùng ở l2-tech (RSI computed) + narrative; không dùng BCTC.
#  - HAH: signals_technical không khả dụng khi ghi snapshot → thay bằng VGC ở l2-tech.
#  - POM: valuation partial (EPS âm, không có P/E) → task L5 dạng 'dữ liệu một phần' (kèm yêu cầu giải thích).
#  - HDB: trễ kỳ (mới nhất Q2/2026) → dùng làm bẫy l4-future hỏi Q3/2026 (mã khác đã có Q3).
#  - movers universe 'hose': partial (missing 30 mã) → chỉ dùng universe vn30.
#  - vn_equity_quote_batch: đã hồi phục → dùng cho l3-agg + l4-2src (nguồn 2 bảng giá).
#  - vn_equity_quote_batch vs candles: CÓ bẫy đơn vị (đồng vs nghìn đồng) trong l4-2src —
#    bẫy được nêu công khai trong đề (premise), agent phải tự quy đổi khi đối chiếu.

