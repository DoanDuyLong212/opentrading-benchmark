name: offline

# No model credentials are used anywhere in this workflow. Every job runs from a
# clean clone with pinned tool artifacts and pinned dependencies.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TZ: Asia/Bangkok

jobs:
  active-v47:
    name: Active v4.7 suite and corpus verifier
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned offline dependencies
        run: |
          python -m pip install \
            --require-hashes --only-binary=:all: \
            -r experiments/finance-v47-study/tools/bootstrap/requirements-offline.lock
      - name: Active v4.7 test suite
        run: python -m pytest -q experiments/finance-v47-study/tools/tests
      - name: Local corpus, oracle and grader mutation verification
        run: |
          python experiments/finance-v47-study/tools/verify_offline.py \
            --study-root experiments/finance-v47-study \
            --out /tmp/offline-verification.json
          python - <<'PY'
          import json
          receipt = json.load(open('/tmp/offline-verification.json'))
          assert receipt['pass'], receipt['failures']
          print('verified', receipt['tasks_checked'], 'tasks;', receipt['mutations_checked'], 'mutations')
          PY

  legacy-v46u:
    name: Historical v4.6u calculator compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned offline dependencies
        run: |
          python -m pip install \
            --require-hashes --only-binary=:all: \
            -r experiments/finance-v47-study/tools/bootstrap/requirements-offline.lock
      - name: Bootstrap pinned Bun and verify receipt bytes
        run: |
          python experiments/finance-v47-study/tools/bootstrap_offline.py \
            --prefix .toolchains --cache .bootstrap-cache --skip-python --skip-runtime-deps
      - name: Install historical runtime dependencies with the pinned Bun
        working-directory: experiments/finance-v46-update-study/experiments/opentrading-runtime
        run: "$GITHUB_WORKSPACE/.toolchains/bun/bin/bun install --frozen-lockfile"
      - name: Historical calculator and math-audit tests
        env:
          BENCH_BUN_BIN: ${{ github.workspace }}/.toolchains/bun/bin/bun
        run: |
          python -m pytest -q \
            experiments/finance-v46-update-study/tools/tests/test_v45_calculate.py \
            experiments/finance-v46-update-study/tools/tests/test_v45_math_audit.py

  offline-bootstrap:
    name: Pinned toolchain bootstrap and locator receipts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .bootstrap-cache
          key: bootstrap-${{ runner.os }}-${{ hashFiles('experiments/finance-v47-study/tools/bootstrap/toolchain-receipts.json', 'experiments/finance-v47-study/tools/bootstrap/python-artifacts.json', 'experiments/finance-v47-study/tools/bootstrap/dsh/package-lock.json') }}
      - name: Bootstrap pinned toolchains
        run: |
          python experiments/finance-v47-study/tools/bootstrap_offline.py \
            --prefix .toolchains --cache .bootstrap-cache
      - name: Verify installed receipts only
        run: |
          python experiments/finance-v47-study/tools/bootstrap_offline.py \
            --prefix .toolchains --cache .bootstrap-cache --verify-only

  sandbox-image:
    name: Shell sandbox image smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build the pinned sandbox image
        run: |
          docker build \
            -t ot-bench-shell:ci \
            experiments/finance-v47-study/tools/runners/sandbox
      - name: Bounded no-network smoke
        run: |
          docker run --rm --network none ot-bench-shell:ci \
            python -c "import numpy, pandas; print('numpy', numpy.__version__, 'pandas', pandas.__version__)"
          docker run --rm --network none ot-bench-shell:ci gawk --version | head -1
          docker run --rm --network none ot-bench-shell:ci bc --version | head -1
